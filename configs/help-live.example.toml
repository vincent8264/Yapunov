# Continuous local keyword spotting plus periodically scheduled YAMNet inference.
# Copy this file to a private config, verify the microphone settings, and supply a
# locally trained models/help-kws.onnx described in models/README.md.
[runtime]
interval_seconds = 0.0

[input]
type = "microphone"
sample_rate = 16000
duration_seconds = 0.2

[preprocessing]
type = "audio_sliding_window"
sample_rate = 16000
duration_seconds = 1.0
peak_normalize = false

[inference]
type = "scheduled_audio"
environment_every_steps = 3

[inference.environment]
type = "yamnet"
model = "../models/yamnet.onnx"
background_threshold = 0.10

[inference.keyword]
type = "keyword_spotter"
model = "../models/help-kws.onnx"
activation_threshold = 0.62
positive_index = 0

[decision]
type = "sound_events"
thresholds = { smoke_alarm = 0.25, glass_break = 0.20, fall_thud = 0.20, help_call = 0.62 }
confirmations = { smoke_alarm = 2, glass_break = 1, fall_thud = 1, help_call = 2 }
hold_seconds = 3.0
notification_cooldown_seconds = 60.0

[hardware]
type = "mock"
verbose = true

[notifications]
type = "none"
device_name = "Home sound monitor"
timezone = "America/Los_Angeles"
