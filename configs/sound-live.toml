# Live local-only YAMNet configuration for the MOVO USB-M1. Download the model
# documented in models/README.md before running. Omit `device` to use the operating
# system's default input, or set it to the verified device name/index.
[runtime]
interval_seconds = 0.0

[input]
type = "microphone"
# This verified USB microphone exposes 48 kHz capture on this laptop. The
# waveform preprocessor below resamples each frame to YAMNet's 16 kHz input.
sample_rate = 48000
duration_seconds = 1.0
device = "UAC 1.0 Microphone"

[preprocessing]
type = "audio_waveform"
sample_rate = 16000
duration_seconds = 1.0
peak_normalize = false

[inference]
type = "yamnet"
model = "../models/yamnet.onnx"
background_threshold = 0.10

[decision]
type = "sound_events"
# Starting values only: calibrate these with genuine recordings from the deployment room.
thresholds = { smoke_alarm = 0.25, glass_break = 0.20, fall_thud = 0.20 }
confirmations = { smoke_alarm = 2, glass_break = 1, fall_thud = 1 }
hold_seconds = 5.0
notification_cooldown_seconds = 60.0

[hardware]
type = "mock"
verbose = true

# Capture and display independent 50 ms chunks. Their 13-band spectrum is animated
# at 20 Hz; after the first one-second window, YAMNet receives a rolling window every
# 200 ms (five inferences per second).
[display]
type = "audio_spectrum"
rate_hz = 20
inference_hop_seconds = 0.2
floor_db = -60.0
ceiling_db = -6.0

[notifications]
type = "none"
device_name = "Home sound monitor"
timezone = "America/Los_Angeles"
