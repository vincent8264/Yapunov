# Live UNO Q deployment: USB microphone input, local YAMNet inference, and the
# classified event drawn on the matrix. Package it with:
#   uv run python scripts/package_app_lab.py
# The microphone needs a powered USB-C hub and App Lab in Network Mode.
[runtime]
interval_seconds = 0.0

[input]
type = "arduino_microphone"
# Omit `device` to use the first plugged-in USB microphone.
sample_rate = 16000
duration_seconds = 1.0

[preprocessing]
# The combined streaming inference engine receives each display-sized microphone
# frame once, then maintains its own ASR stream and rolling YAMNet window.
type = "identity"

[inference]
type = "transcript_help_yamnet"
model = "../models/yamnet.onnx"
asr_model_dir = "../models/sherpa-onnx-streaming-zipformer-en-2023-06-26"
background_threshold = 0.10
asr_threads = 1
yamnet_window_seconds = 1.0
yamnet_hop_seconds = 0.2

[decision]
type = "sound_events"
# Starting values only: calibrate these with genuine recordings from the deployment room.
thresholds = { smoke_alarm = 0.50, glass_break = 0.50, fall_thud = 0.20, help_call = 1.00 }
confirmations = { smoke_alarm = 1, glass_break = 1, fall_thud = 1, help_call = 1 }
hold_seconds = 5.0
notification_cooldown_seconds = 30.0

[hardware]
type = "uno_q"

# Capture and display independent 50 ms chunks. Zipformer receives each chunk once;
# the combined engine retains a rolling one-second YAMNet window every 200 ms.
[display]
type = "audio_spectrum"
rate_hz = 20
floor_db = -60.0
ceiling_db = -6.0

[notifications]
type = "none"
device_name = "Home sound monitor"
