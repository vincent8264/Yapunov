# Live UNO Q deployment: USB microphone input, local YAMNet inference, and the
# classified event drawn on the matrix. Package it with:
#   uv run python scripts/package_app_lab.py
# The microphone needs a powered USB-C hub and App Lab in Network Mode.
[runtime]
interval_seconds = 0.0

[input]
type = "arduino_microphone"
# Omit `device` to use the first plugged-in USB microphone.
sample_rate = 16000
duration_seconds = 1.0

[preprocessing]
type = "audio_waveform"
sample_rate = 16000
duration_seconds = 1.0
peak_normalize = false

[inference]
type = "yamnet"
model = "../models/yamnet.onnx"
background_threshold = 0.10

[decision]
type = "sound_events"
# Starting values only: calibrate these with genuine recordings from the deployment room.
thresholds = { smoke_alarm = 0.50, glass_break = 0.50, fall_thud = 0.20 }
confirmations = { smoke_alarm = 1, glass_break = 1, fall_thud = 1 }
hold_seconds = 5.0
notification_cooldown_seconds = 30.0

# Developing risks are tracked separately from the emergencies above. A warning
# prints only when any listed YAMNet label scores at or above `threshold` for at
# least `min_detected_seconds` of the last `window_seconds`. Labels must match the
# YAMNet class map exactly. Thresholds are uncalibrated starting values.
[decision.risks.water_leak]
message = "Possible water leak detected"
labels = ["Drip", "Trickle, dribble", "Gush", "Water tap, faucet"]
threshold = 0.15
window_seconds = 20.0
min_detected_seconds = 8.0
cooldown_seconds = 15.0

[hardware]
type = "uno_q"

# Capture and display independent 50 ms chunks. Their 13-band spectrum is animated
# at 20 Hz; after the first one-second window, YAMNet receives a rolling window every
# 200 ms (five inferences per second).
[display]
type = "audio_spectrum"
rate_hz = 20
inference_hop_seconds = 0.2
floor_db = -60.0
ceiling_db = -6.0

[notifications]
type = "none"
device_name = "Home sound monitor"
