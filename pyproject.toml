[project]
name = "edge-ai-hackathon-starter"
version = "0.1.0"
description = "Hardware-free Edge AI starter architecture for the Arduino UNO Q"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "opencv-python>=4.10",
    "sounddevice>=0.5.2",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
asr = ["sherpa-onnx>=1.13.6"]

[project.scripts]
edge-ai = "edge_ai.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
