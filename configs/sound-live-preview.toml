# Desktop visual test for the live YAMNet configuration. It opens a 13x8 matrix
# preview window; no UNO Q is required. Download models/yamnet.onnx first.
[runtime]
interval_seconds = 0.0

[input]
type = "microphone"
sample_rate = 48000
duration_seconds = 1.0
device = 11

[preprocessing]
type = "audio_waveform"
sample_rate = 16000
duration_seconds = 1.0
peak_normalize = false

[inference]
type = "yamnet"
model = "../models/yamnet.onnx"
background_threshold = 0.10

[decision]
type = "sound_events"
thresholds = { smoke_alarm = 0.50, glass_break = 0.50, fall_thud = 0.20 }
confirmations = { smoke_alarm = 1, glass_break = 1, fall_thud = 1 }
hold_seconds = 5.0
notification_cooldown_seconds = 60.0

[hardware]
type = "matrix_preview"
pixel_size = 28

[display]
type = "audio_spectrum"
rate_hz = 20
inference_hop_seconds = 0.2
floor_db = -60.0
ceiling_db = -6.0

[notifications]
type = "none"
device_name = "Home sound monitor"
timezone = "America/Los_Angeles"
