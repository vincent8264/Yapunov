# Copy this file to `private-live.toml` and replace the example SMTP addresses.
# `private-live.toml` is ignored by Git. Keep the password out of this file and
# provide it through the EDGE_AI_SMTP_PASSWORD environment variable instead.
[runtime]
interval_seconds = 0.0

[input]
type = "microphone"
sample_rate = 16000
duration_seconds = 1.0

[preprocessing]
type = "audio_waveform"
sample_rate = 16000
duration_seconds = 1.0
peak_normalize = false

[inference]
type = "yamnet"
model = "../models/yamnet.onnx"
background_threshold = 0.10

[decision]
# Starting values only: calibrate these with genuine recordings from the room.
type = "sound_events"
thresholds = { smoke_alarm = 0.25, glass_break = 0.20, fall_thud = 0.20 }
confirmations = { smoke_alarm = 2, glass_break = 1, fall_thud = 1 }
hold_seconds = 5.0
notification_cooldown_seconds = 60.0

[hardware]
# Change to "uno_q" only after verifying the physical board and Bridge setup.
type = "mock"
verbose = true

[notifications]
type = "smtp"
# The setup portal writes only recipient preferences here; SMTP secrets never do.
settings_file = "../data/notification-settings.json"
device_name = "Living room sound monitor"
timezone = "America/Los_Angeles"
host = "smtp.example.com"
port = 587
sender = "monitor@example.com"
# Add as many as five comma-separated addresses, for example:
# recipient = "family@example.com, neighbor@example.com"
recipient = "family@example.com"
username = "monitor@example.com"
password_env = "EDGE_AI_SMTP_PASSWORD"
starttls = true
timeout_seconds = 5.0
status_log = true

# Optional liveness heartbeat. The device POSTs to `url` every `interval_seconds`
# while its main loop is running; `edge-ai heartbeat-server` with this same file
# emails the recipients above when heartbeats stop. Remove both tables to disable.
# Generate a token once, for example with:
#   export EDGE_AI_HEARTBEAT_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
[heartbeat]
# The server computer's LAN address, reachable from the UNO Q (not localhost).
url = "http://192.0.2.10:8090/heartbeat"
device_id = "home-sound-monitor"
token_env = "EDGE_AI_HEARTBEAT_TOKEN"
interval_seconds = 60.0
timeout_seconds = 5.0
# Stop heartbeats if the main loop has not advanced for this long.
stall_seconds = 30.0

[heartbeat_server]
# 0.0.0.0 accepts heartbeats from the LAN; use 127.0.0.1 for a laptop-only test.
host = "0.0.0.0"
port = 8090
# Email after this long without a heartbeat. 150 s tolerates one lost request.
missing_after_seconds = 150.0
