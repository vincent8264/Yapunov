# Hardware-free integration demo. The spectral classifier is deliberately a
# transparent baseline, not the production safety model.
[runtime]
interval_seconds = 0.35

[input]
type = "simulated_sound"
events = [
  "background",
  "smoke_alarm",
  "background",
  "glass_break",
  "background",
  "fall_thud",
]
sample_rate = 16000
duration_seconds = 1.0
seed = 7
loop = true

[preprocessing]
type = "audio_features"
sample_rate = 16000
duration_seconds = 1.0

[inference]
type = "spectral_demo"
min_rms = 0.02

[decision]
type = "sound_events"
thresholds = { smoke_alarm = 0.80, glass_break = 0.80, fall_thud = 0.80 }
confirmations = 1
hold_seconds = 0.0
notification_cooldown_seconds = 60.0

[hardware]
type = "mock"
verbose = true

[notifications]
type = "none"
device_name = "Demo sound monitor"
